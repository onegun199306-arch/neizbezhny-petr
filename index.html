function toy(color, scale, seed){

    const m=new THREE.Mesh(new THREE.SphereGeometry(1,32,24),silicone);

  }

  ellipsoid(.29,.27,.27,.25,.30,.05);

    const theta=(j*2.399963+seed)%(Math.PI*2);
    const cx=side*.25, cy=.30, cz=.05;

    const middle=start.clone().add(new THREE.Vector3(vx*.055,.085,vz*.045));

  }

  return g;
}

    const dx=petr.position.x-obstacle.mesh.position.x;
    const dz=petr.position.z-obstacle.mesh.position.z;
    if(!obstacle.hit&&invincible<=0&&petr.position.y<0.95&&!crouch&&Math.abs(dx)<1.25&&Math.abs(dz)<.85){
      obstacle.hit=true;lives--;invincible=1.5;
      document.getElementById('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
      sound(150,.3,'sawtooth',.12,50);toast.textContent='💥 Пётр врезался в ограждение!';toast.style.opacity='1';toastTime=t+1.5;
      if(lives<=0)finish('lives');
    }
  }
  // Машины двигаются, при столкновении отнимают жизнь.
  for(const car of traffic){
    car.mesh.position.z-=car.speed*dt;
    if(car.mesh.position.z<petr.position.z-45)car.mesh.position.z=petr.position.z-110;
    car.hitCooldown=Math.max(0,car.hitCooldown-dt);
    if(invincible<=0&&car.hitCooldown===0&&petr.position.y<1.05&&
       Math.abs(petr.position.x-car.mesh.position.x)<1.55&&
       Math.abs(petr.position.z-car.mesh.position.z)<2.1){
      car.hitCooldown=2;invincible=1.5;lives--;
      document.getElementById('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
      toast.textContent='🚗 Осторожно, машина!';toast.style.opacity='1';toastTime=t+1.5;
      sound(180,.35,'sawtooth',.13,55);
      if(lives<=0)finish('lives');
    }
  }
  for(const pedestrian of pedestrians){
    pedestrian.mesh.position.z+=pedestrian.speed*dt;
    if(pedestrian.mesh.position.z>petr.position.z+24)pedestrian.mesh.position.z=petr.position.z-100;
    pedestrian.mesh.rotation.z=Math.sin(t*4+pedestrian.phase)*.035;
  }
  // Виктория бежит вслед, но даёт игроку шанс уйти.
  const toPetr=new THREE.Vector3().subVectors(petr.position,victoria.position);toPetr.y=0;
  if(toPetr.length()>1.25){
    toPetr.normalize();const chaseSpeed=2.4+Math.floor(score/10)*.12;
    victoria.position.addScaledVector(toPetr,dt*chaseSpeed);
    victoria.rotation.y=Math.atan2(-toPetr.x,-toPetr.z);
    victoria.position.y=Math.abs(Math.sin(t*9))*.07;
  }else if(!gameOver){toast.textContent='📱 Виктория догнала Петра с телефоном!';toast.style.opacity='1';finish('caught');}
}
// Перемещаем декорации за горизонт, чтобы город казался бесконечным.
for(const obj of scenery){if(obj.position.z>petr.position.z+26)obj.position.z-=126;}
for(const car of parkedCars){if(car.position.z>petr.position.z+25)car.position.z-=110;}
for(const obstacle of obstacles){
  if(obstacle.mesh.position.z>petr.position.z+18){obstacle.mesh.position.z-=100;obstacle.hit=false;}
}
for(const [i,obj] of collectibles.entries()){
  if(!obj.visible||gameOver)continue;
  obj.rotation.y+=dt*1.7;
  obj.position.y=.38+Math.sin(t*2.5+i)*.13;
  const dx=petr.position.x-obj.position.x,dz=petr.position.z-obj.position.z;
  if(dx*dx+dz*dz<1.45*1.45){
    score++;
    document.getElementById('score').textContent=score;
    sound(660,.12,'sine',.07,1100);
    if(score%10===0){
      sound(890,.3,'square',.07,450);
      toast.textContent=`⚡ Виктория ускорилась! Уже ${Math.floor(score/10)} ускорений!`;
    }else{
      toast.textContent=['Пётр: «Это ещё что?!» 😳','Пётр: «Коллекция растёт!» 😂','Пётр: «Только бы никто не видел!» 🙈'][score%3];
    }
    toast.style.opacity='1';toastTime=t+1.7;
    placeCollectible(obj,nextSpawn++);
    if(score>=TOTAL)finish('caught');
  }else if(obj.position.z>petr.position.z+8){
    // Пропущенный предмет перемещается дальше: уровень остаётся проходимым.
    placeCollectible(obj,nextSpawn++);
  }
}
document.getElementById('vSpeed').textContent=(2.4+Math.floor(score/10)*.12).toFixed(1);
document.getElementById('nextBoost').textContent=10-score%10;
if(t>toastTime)toast.style.opacity='0';
camera.position.lerp(new THREE.Vector3(petr.position.x,5,petr.position.z+9),Math.min(1,dt*5));camera.lookAt(petr.position.x,1.5,petr.position.z-2);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
